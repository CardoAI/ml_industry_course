# ──────────────────────────────────────────────────────────────────────────────
# Day 4 — MLOps: Docker Compose (Local Development / Staging)
#
# Docker Compose is a tool for defining multi-container applications.
# It is designed for LOCAL DEVELOPMENT and STAGING — not production.
# In production, you would use an orchestrator like:
#   - Kubernetes (EKS, GKE, AKS) — the industry standard
#   - AWS ECS / Google Cloud Run — managed container platforms
#   - Docker Swarm — simpler but less capable
#
# The patterns here — health checks, environment-based configuration,
# restart policies, service dependencies — transfer directly to those
# production orchestrators.
#
# This file brings up two services:
#   - mlflow     — tracking server (experiment UI + model registry)
#   - model-svc  — FastAPI prediction service (loads model from registry)
#
# Two ways to run the prediction service:
#
#   docker run (standalone):
#     Uses the model baked into the image at build time.
#     No external dependencies — good for demos and air-gapped environments.
#
#   docker compose up (this file):
#     Overrides MODEL_URI to pull from the MLflow registry instead.
#     This lets you swap model versions without rebuilding the image —
#     just update the @champion alias and restart the service.
#
# Usage:
#   # Requires: make mlflow-server + make train + make docker-build
#  Specifically:
#   make -f day4/Makefile mlflow-server   # terminal 1 (if not already running)
#   make -f day4/Makefile train           # generates last_run_id.txt + @champion alias
#   make -f day4/Makefile docker-build    # builds adult-income-predictor:latest locally
#   make -f day4/Makefile docker-compose-up  # now it finds the image
#
# Endpoints:
#   MLflow UI      →  http://localhost:5000
#   Prediction API →  http://localhost:8080
#   API docs       →  http://localhost:8080/docs
# ──────────────────────────────────────────────────────────────────────────────

services:

  # ── MLflow tracking server ─────────────────────────────────────────────────
  # Provides the MLflow UI and model registry.
  # Uses the official pre-built MLflow image (pinned version for
  # reproducibility — never use :latest in a real project).
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.21.3

    working_dir: /app

    # Mount the day4 directory so the SQLite database and model artifacts
    # persist on the host filesystem (not lost when the container stops).
    # Artifact URIs in mlflow.db are relative (./day4/mlartifacts/...).
    # With working_dir: /app and this mount, they resolve correctly.
    volumes:
      - ./day4:/app/day4

    # Launch the tracking server.
    # --host 0.0.0.0: listen on all interfaces (required inside Docker)
    # --backend-store-uri: metadata (runs, metrics, params) in SQLite
    # --default-artifact-root: model files and reports on local filesystem
    command: >
      mlflow server
        --host 0.0.0.0
        --port 5000
        --backend-store-uri sqlite:///day4/mlflow.db
        --default-artifact-root /app/day4/mlartifacts

    ports:
      - "5000:5000"

    # Health check — Docker (and orchestrators like K8s) use this to know
    # when the service is ready to accept traffic.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

    # Restart automatically if the process crashes.
    # "unless-stopped" means: always restart, unless the user explicitly
    # ran `docker compose stop`. In K8s, this maps to restartPolicy: Always.
    restart: unless-stopped

  # ── Prediction service ─────────────────────────────────────────────────────
  # FastAPI app serving model predictions. At startup it connects to the
  # MLflow service above and loads the champion model from the registry.
  model-svc:
    image: adult-income-predictor:latest

    # Override the baked-in MODEL_URI so the service pulls from the MLflow
    # registry instead of using the model copied into the image at build time.
    # "mlflow" is the Docker Compose service name → resolves via internal DNS.
    # This is more realistic: in production you configure model versions via
    # environment variables, not by rebuilding the image.
    environment:
      - MODEL_URI=models:/adult-income-classifier@champion
      - MLFLOW_TRACKING_URI=http://mlflow:5000

    ports:
      - "8080:8080"

    # Health check on the prediction service — uses the /health endpoint
    # that predict.py already exposes. Reports model_loaded status too.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

    # Wait for the MLflow healthcheck to pass before starting.
    # Without this, model-svc would try to load the model before MLflow
    # is ready, and fail with a connection error.
    depends_on:
      mlflow:
        condition: service_healthy

    restart: unless-stopped
